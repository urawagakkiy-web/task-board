<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスクボード</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="board">
  <h1 class="logo">タスクボード</h1>
  <p class="lead">やることを書き出して、終わったらチェック。</p>
  <div id="root" class="panel"></div>
</div>

<!-- React 本体（UMD）とJSX変換。ビルドツールは使わず、CDNから直接読み込む -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

const STORAGE_KEY = "task-board-tasks";

/**
 * localStorage は file:// や一部ブラウザで SecurityError を投げ、直接呼ぶと初期描画ごと落ちる。
 * 読み書きは必ずこの store を経由し、失敗したらメモリへ退避して ok を false にする。
 */
const store = {
  ok: true,
  memory: null,
  load() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      this.ok = false;
      return this.memory;
    }
  },
  save(value) {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    } catch (error) {
      this.ok = false;
      this.memory = value;
    }
  },
};

/** 保存済みデータを読み出す。壊れた値が入っていても落ちないよう、形を検証してから使う */
function loadTasks() {
  const saved = store.load();
  if (!Array.isArray(saved)) return [];
  return saved
    .filter((task) => task && typeof task.text === "string" && task.text.trim() !== "")
    .map((task, index) => ({ id: index + 1, text: task.text, done: task.done === true }));
}

/** 1タスク。完了済みは .done を付けてグレー＋取り消し線にする */
function TaskItem({ task, onToggle, onDelete }) {
  return (
    <li className={task.done ? "task done" : "task"}>
      <label>
        <input
          type="checkbox"
          checked={task.done}
          onChange={() => onToggle(task.id)}
        />
        <span className="text">{task.text}</span>
      </label>
      <button
        type="button"
        className="delete"
        aria-label={`「${task.text}」を削除`}
        title="削除"
        onClick={() => onDelete(task.id)}
      >
        ×
      </button>
    </li>
  );
}

function TaskBoard() {
  const [tasks, setTasks] = useState(loadTasks);
  const [text, setText] = useState("");
  const [saveFailed, setSaveFailed] = useState(!store.ok);
  const nextId = useRef(tasks.reduce((max, task) => Math.max(max, task.id), 0) + 1);

  // タスクが変わるたびに保存する（保存できなければ画面に警告を出す）
  useEffect(() => {
    store.save(tasks);
    setSaveFailed(!store.ok);
  }, [tasks]);

  // 追加：空白だけの入力は無視し、追加後は入力欄を空に戻す
  const addTask = (event) => {
    event.preventDefault();
    const title = text.trim();
    if (!title) return;
    setTasks((prev) => [...prev, { id: nextId.current++, text: title, done: false }]);
    setText("");
  };

  // 完了・未完了の切り替え
  const toggleTask = (id) =>
    setTasks((prev) =>
      prev.map((task) => (task.id === id ? { ...task, done: !task.done } : task))
    );

  // 削除
  const deleteTask = (id) => setTasks((prev) => prev.filter((task) => task.id !== id));

  // 件数はハードコードせず tasks から算出する
  const remaining = tasks.filter((task) => !task.done).length;

  return (
    <>
      {saveFailed && (
        <p className="warn" role="status">
          このブラウザでは保存できません。ページを閉じるとタスクが消えます。
        </p>
      )}

      <form className="add-form" onSubmit={addTask}>
        <input
          type="text"
          value={text}
          onChange={(event) => setText(event.target.value)}
          placeholder="やることを入力"
          aria-label="やること"
        />
        <button type="submit" disabled={!text.trim()}>追加</button>
      </form>

      {tasks.length === 0 ? (
        <p className="empty">タスクはまだありません。上の欄から追加してください。</p>
      ) : (
        <ul className="task-list">
          {tasks.map((task) => (
            <TaskItem
              key={task.id}
              task={task}
              onToggle={toggleTask}
              onDelete={deleteTask}
            />
          ))}
        </ul>
      )}

      <p className="count">未完了 {remaining} 件 ／ 全 {tasks.length} 件</p>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TaskBoard />);
</script>

<script>
  // CDNに繋がらないと React を読み込めないので、その場合は理由を画面に出す
  window.addEventListener("load", function () {
    var root = document.getElementById("root");
    if (!root.hasChildNodes()) {
      root.innerHTML =
        '<p class="offline">Reactの読み込みに失敗しました。ネットワークに接続してから再読み込みしてください。</p>';
    }
  });
</script>
</body>
</html>
